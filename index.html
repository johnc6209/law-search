    if(OPEN.indexOf(ch)>=0){if(lit.trim())lists.push([lit.trim()]);lit='';var dep=0,j=i;

      lists.push(group(p.slice(i+1,j),cx,d));i=j+1}
    else{lit+=ch;i++}}
  if(lit.trim())lists.push([lit.trim()]);
  return lists.reduce(function(acc,l){var o=[];acc.forEach(function(a){l.forEach(function(b){o.push(a+b)})});return o},['']);
}
function group(inner,cx,d){
  if(!/죄명/.test(inner))return alts(inner,cx,d);
  var out=[],buf=[];
  splitTop(inner.replace(/\s및\s/g,', ')).forEach(function(t){
    if(/^\s*[(\[〔【]/.test(t)){if(buf.length)throw 0;out=out.concat(seq(t.trim(),cx,d))}
    else if(/죄명/.test(t)){buf.push(t);out=out.concat(refs(buf.join(','),cx,d));buf=[]}
    else if(/^\s*(제?\s*\d|내지)/.test(t))buf.push(t);
    else out=out.concat(seq(t.trim(),cx,d));
  });
  if(buf.length)throw 0;
  return out;
}
function spec(t,last){
  var m=nk(t).match(/^(?:제?(\d+)조(?:의(\d+))?)?(?:제?(\d+)항)?(?:제?(\d+)호)?$/);
  if(!m||!(m[1]||m[3]))throw 0;
  return {a:m[1]?m[1]+(m[2]?'의'+m[2]:''):last,h:m[3]||'',o:m[4]||''};
}
function refs(txt,cx,d){
  if(d>5||/다만|전조|형법|본조|가목|단서|전단/.test(txt))throw 0;
  txt=txt.replace(/각항의|각호|각\s*죄명|죄명/g,'');
  var toks=[];splitTop(txt).forEach(function(t){t=t.trim();if(!t)return;if(/^내지/.test(t)&&toks.length)toks[toks.length-1]+=' '+t;else toks.push(t)});
  var L=cx.L,targets=[],last=cx.a;
  toks.forEach(function(t){
    var rg=t.split('내지');
    if(rg.length==2){var A=spec(rg[0],last),B=spec(rg[1],A.a);last=B.a;
      if(A.a==B.a&&A.h&&B.h){for(var h=+A.h;h<=+B.h;h++)targets.push({a:A.a,h:''+h,o:''})}
      else{var i1=L.arts.indexOf(A.a),i2=L.arts.indexOf(B.a);if(i1<0||i2<0)throw 0;
        L.arts.slice(i1,i2+1).forEach(function(a){targets.push({a:a,h:'',o:''})})}}
    else{var S=spec(t,last);last=S.a;targets.push(S)}
  });
  var out=[];
  targets.forEach(function(T){var hit=0;
    L.rows.forEach(function(r){
      if(r.a!=T.a||/삭제/.test(r.n))return;
      if(T.h&&r.h.indexOf(T.h)<0)return;
      if(T.o&&r.o.indexOf(T.o)<0)return;
      hit=1;out=out.concat(core(r,d+1));
    });
    if(!hit)throw 0;
  });
  return out;
}
function core(r,d){
  if(r.x)throw 0;
  var cx={L:r.L,a:r.a};
  if(r.L.t<=2)return alts(r.n,cx,d);
  var s=r.n.slice(r.L.k.length+2);
  if(!s)return[''];
  var o=s[0],in_=s.slice(1,-1);
  if(o=='(')return splitTop(in_).map(function(x){return x.trim()});
  return alts(in_,cx,d);
}
function expand(r){
  if(/삭제/.test(r.n))return null;
  try{var a=core(r,0);}catch(e){return null}
  if(r.L.t>2){var p=r.L.k+'위반';a=a.map(function(x){return x?p+'('+x+')':p})}
  a=a.map(function(x){return x.replace(/과실과실/g,'과실').replace(/\s+(?=[()])|(?<=[()])\s+/g,'')});
  var seen={};a=a.filter(function(x){x=x.replace(/\s+(?=[()])|(?<=[()])\s+/g,'');if(seen[x])return 0;return seen[x]=1});
  if(a.length<2)return null;
  return a;
}

/* ---------- 검색 ---------- */
function findLaw(s){
  var k=nk(s);if(!k)return{};
  var full=ALIAS[k]||ALIAS[k+'법']||(BY[k]&&BY[k].k)||(BY[k+'법']&&BY[k+'법'].k);
  if(full)return{law:BY[nk(full)]};
  var c=[];LAWS.forEach(function(L){if(nk(L.k).indexOf(k)==0)c.push(L)});
  Object.keys(ALIAS).forEach(function(a){if(a.indexOf(k)==0){var L=BY[nk(ALIAS[a])];if(c.indexOf(L)<0)c.push(L)}});
  if(c.length==1&&k.length>=2)return{law:c[0]};
  return{cands:c,other:/법률?$|특례법$|규칙$|령$/.test(k)?k:null};
}
function artLabel(r){
  if(r.a=='*')return r.c=='그 외'?'그 외 조문':'조문 공통';
  var s='제'+r.a.replace('의','조의');if(r.a.indexOf('의')<0)s+='조';
  if(r.h.length)s+=' 제'+r.h.join('ㆍ')+'항';
  if(r.o.length)s+=' 제'+r.o.join('ㆍ')+'호';
  return s;
}
function cn(L){return L.c}
function artUrl(c,a){return 'https://casenote.kr/법령/'+c+(a&&a!='*'?'/제'+(a.indexOf('의')<0?a+'조':a.replace('의','조의')):'')}
function rowHtml(r,showLaw){
  var ex=expand(r),h='<div class="r"><div class="hd"><span>'+(showLaw?esc(r.L.k)+' ':'')+esc(artLabel(r))+' · 별표 '+r.L.t+'</span><a target="_blank" rel="noopener" href="'+esc(artUrl(cn(r.L),r.a))+'">조문 보기 ↗</a></div>';
  h+='<div class="n">'+esc(r.n)+'</div>';
  if(r.c)h+='<div class="c">'+esc(r.c)+'</div>';
  if(ex){var chips=ex.map(function(x){return '<span class="ch">'+esc(x)+'</span>'}).join('');
    h+=ex.length>12?'<details class="x"><summary>개별 죄명 '+ex.length+'개 보기</summary>'+chips+'</details>':'<div class="x">'+chips+'</div>'}
  return h+'</div>';
}
var RULE={5:['정범ㆍ기수ㆍ미수ㆍ예비ㆍ음모: 별표 5에 의함','공범(교사 또는 방조): 「위 법률위반(구분 표시죄명)교사」 또는 「위 법률위반(구분 표시죄명)방조」']};
function notes(L){var a=(RULE[L.t]||[]).concat(L.notes);return a.length?'<div class="nt">'+a.map(function(s){return '<p>'+esc(s)+'</p>'}).join('')+'</div>':''}
function otherHtml(k,raw){
  var name=k+'위반',c=LNAME[k]||raw.trim().replace(/\s+/g,'_');
  return '<div class="r"><div class="hd"><span>죄명표에 없는 법률 · 예규 6항</span><a target="_blank" rel="noopener" href="'+esc(artUrl(c,ART))+'">조문 보기 ↗</a></div><div class="n">'+esc(name)+'</div></div>'+
  '<div class="nt"><p>원칙: 「…법위반」으로 표시</p><p>공범: 공범에 관한 특별규정이 있으면 「'+esc(name)+'」, 없으면 「'+esc(name)+'교사」 또는 「'+esc(name)+' 방조」</p><p>미수: 「'+esc(name)+'」</p></div>';
}
var ART='';
function search(q){
  var o=$('o');ART='';
  try{history.replaceState(null,'',q?'#'+encodeURIComponent(q):location.pathname)}catch(e){}
  q=q.trim();if(!q){o.innerHTML='';return}
  q=q.replace(/[①-⑨]/g,function(c){return ' '+('①②③④⑤⑥⑦⑧⑨'.indexOf(c)+1)+'항'});
  var m=q.match(/^(.*?)(?:제\s*)?(\d+)\s*조?\s*(?:의\s*(\d+))?(.*)$/);
  if(m){
    var lawS=m[1].replace(/제\s*$/,'').trim(),a=m[2]+(m[3]?'의'+m[3]:''),rest=m[4];
    var hm=rest.match(/(\d+)\s*항/),om=rest.match(/(\d+(?:\s*의\s*\d+)?)\s*호/);
    if(!hm&&!om){var bare=rest.match(/^\s*(\d+)/);if(bare)hm=bare}
    var h=hm?hm[1]:'',ho=om?om[1].replace(/\s/g,''):'';
    ART=a;
    var f=lawS?findLaw(lawS):{law:BY['형법']};
    if(f.law){
      var L=f.law,rows=L.rows.filter(function(r){return r.a==a}),note='';
      if(rows.length&&(h||ho)){var ex=rows.filter(function(r){return(!h||r.h.indexOf(h)>=0)&&(!ho||r.o.indexOf(ho)>=0)});
        if(ex.length)rows=ex;else note='<p class="m">해당 항ㆍ호와 정확히 일치하는 항목이 없어 제'+esc(a.replace('의','조의'))+(a.indexOf('의')<0?'조':'')+' 전체를 표시합니다.</p>'}
      if(!rows.length){rows=L.rows.filter(function(r){return r.a=='*'});
        if(!rows.length){o.innerHTML='<div class="lw">'+esc(L.k)+'</div><p class="m">죄명표(별표 '+L.t+')에 제'+esc(a)+'조 항목이 없습니다.</p>'+(L.t>=5?'<div class="nt"><p>죄명표에 따로 정하지 않은 조문은 「'+esc(L.k)+'위반」으로 표시합니다(예규 6항 원칙).</p></div>':'')+'<p><a target="_blank" rel="noopener" href="'+esc(artUrl(L.c,a))+'">조문 보기 ↗</a></p>';return}}
      o.innerHTML='<div class="lw">'+esc(L.k)+'</div>'+note+rows.map(function(r){var x=rowHtml(r);return r.a=='*'?x.replace(esc(artUrl(L.c,'*')),esc(artUrl(L.c,a))):x}).join('')+notes(L);return;
    }
    if(f.other){o.innerHTML=otherHtml(f.other,lawS);return}
    o.innerHTML=cands(f.cands,a,h,ho)||'<p class="m">법령을 찾지 못했습니다. 법령 이름을 확인해 주세요.</p>';return;
  }
  // 숫자 없음: 법령 전체 또는 죄명 검색
  var f=findLaw(q),k=nk(q),html='';
  if(f.law){o.innerHTML='<div class="lw">'+esc(f.law.k)+' (별표 '+f.law.t+') 전체</div>'+f.law.rows.map(function(r){return rowHtml(r)}).join('')+notes(f.law);return}
  if(f.cands&&f.cands.length)html+=cands(f.cands);
  if(k.length>=2){var hits=[];LAWS.forEach(function(L){L.rows.forEach(function(r){
      var t=nk(r.L.t>2?r.n.slice(r.L.k.length+2):r.n);if(t.indexOf(k)>=0)hits.push(r)})});
    if(hits.length)html+='<div class="lw">죄명에 「'+esc(q)+'」 포함 ('+hits.length+'건)</div>'+hits.slice(0,80).map(function(r){return rowHtml(r,1)}).join('')+(hits.length>80?'<p class="m">80건까지만 표시합니다. 검색어를 더 구체적으로 입력하세요.</p>':'');}
  if(f.other&&!html)html=otherHtml(f.other,q);
  o.innerHTML=html||'<p class="m">결과가 없습니다.</p>';
}
function cands(c,a,h,ho){
  if(!c||!c.length)return '';
  var tail=a?' '+a.replace('의','조의')+(a.indexOf('의')<0?'조':'')+(h?' '+h+'항':'')+(ho?' '+ho+'호':''):'';
  return '<div class="sg">'+c.map(function(L){return '<button data-q="'+esc(L.k+tail)+'">'+esc(L.k)+'</button>'}).join('')+'</div>';
}

/* ---------- 이벤트 ---------- */
var tm;function toast(){var t=$('t');t.style.display='block';clearTimeout(tm);tm=setTimeout(function(){t.style.display='none'},900)}
function copy(s){try{navigator.clipboard.writeText(s).then(toast)}catch(e){}}
$('q').addEventListener('input',function(){search(this.value)});
document.addEventListener('click',function(e){
  var t=e.target;
  if(t.classList.contains('n')||t.classList.contains('ch'))copy(t.textContent);
  else if(t.dataset.q){$('q').value=t.dataset.q;search(t.dataset.q)}
  else if(t.parentNode.className=='ex'&&t.tagName=='A'){$('q').value=t.textContent;search(t.textContent)}
});
function tab(p){[].forEach.call($('tb').children,function(b){b.className=b.dataset.p==p?'on':''});
  $('s').hidden=p!='s';$('l').hidden=p!='l';(p=='l'?$('lq'):$('q')).focus()}
$('tb').addEventListener('click',function(e){if(e.target.dataset.p)tab(e.target.dataset.p)});
var cat=Object.keys(LINKS)[0];
function links(){var f=nk($('lq').value),src=f?Object.keys(LINKS).map(function(k){return LINKS[k]}).join(' '):LINKS[cat];
  $('ll').innerHTML=src.split(' ').filter(function(s){return !f||nk(s).indexOf(f)>=0}).map(function(s){return '<li><a target="_blank" rel="noopener" href="https://casenote.kr/법령/'+s+'">'+esc(s.replace(/_/g,' '))+'</a></li>'}).join('');
  [].forEach.call($('lc').children,function(b){b.className=!f&&b.textContent==cat?'on':''})}
Object.keys(LINKS).forEach(function(k){var b=document.createElement('button');b.textContent=k;b.onclick=function(){cat=k;$('lq').value='';links()};$('lc').appendChild(b)});
$('lq').addEventListener('input',links);links();
if(location.hash){var h0=decodeURIComponent(location.hash.slice(1));tab('s');$('q').value=h0;search(h0)}else $('lq').focus();
</script></body></html>
